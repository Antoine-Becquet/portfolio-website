languages:
  fr:
    contentDir: "content/fr"
    label: "Français"
    weight: 1
    menu:
      main:
        - identifier: blog
          name: Blog
          title: Articles de blog
          url: /blogs
          weight: 1
    params:
      hero:
        intro: "Bonjour, je m'appelle"
        title: "Antoine."
        subtitle: "Technicien Informatique"
        content: "Passionné par l'infrastructure réseau et la maintenance logicielle. Spécialiste de l'installation de matériel informatique et du support technique de proximité."
        button:
          name: "CV"
          url: "/Antoine_BECQUET_CV_2026.pdf"
      about:
        title: "À propos de moi"
        content: >
          <div style="text-align: center; margin-bottom: 40px; background-color: #111; padding: 40px; border-radius: 10px;">
            <p style="font-style: italic; font-size: 1.5rem; color: #fff; font-family: serif;">
              "Theory and practice sometimes clash. And when that happens, theory loses. Every single time."
            </p>
            <p style="font-style: italic; font-size: 1.1rem; color: #ccc;">
              La théorie et la pratique entrent parfois en conflit, et dans ce cas, la théorie perd, à chaque fois.
            </p>
            <img src="/images/linustorvalds.png" style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin-top: 20px; border: 2px solid #333;">
            <p style="margin-top: 10px; font-weight: bold; color: #fff; margin-bottom: 0;">Linus Torvalds</p>
            <p style="font-size: 0.8rem; color: #888;">Inventeur du noyau Linux</p>
          </div>

          Actuellement technicien informatique Itinérant chez Securinfor, je me déplace chez les clients pour assurer la maintenance de leur infrastructure informatique.
          Voici quelques technologies avec lesquelles j'ai travaillé récemment:
      experience:
        items:
        - company: "Securinfor"
          companyUrl: "https://securinfor.fr/"
          jobs:
            - name: "Technicien Itinérant"
              date: "Déc 2025 - Présent"
              content: "Gestion d'infrastructure pour clients Orano, AXA, BRED. Intervention sur site pour support technique et maintenance système. CDI."

        - company: "Experis France"
          companyUrl: "https://experisfrance.fr/"
          jobs:
            - name: "Helpdesk N1 Naval Group"
              date: "Sept 2025 - Nov 2025"
              content: "Service hotline niveau 1 pour le groupe Naval Group. Support technique aux utilisateurs et escalade des incidents."

        - company: "GE Vernova Offshore Wind"
          companyUrl: "https://gevernova.com/"
          jobs:
            - name: "Support aux utilisateurs et Gestion d'infrastructure"
              date: "Sept 2023 - Sept 2025"
              content: "Contrat en alternance. Support utilisateurs, gestion de l'infrastructure réseau, configuration de postes de travail. Mise en place de solutions IT pour les différents départements de l'entreprise."

        - company: "Ville de Valognes"
          companyUrl: "https://valognes.fr/"
          jobs:
            - name: "Administration réseau et informatique"
              date: "Sept 2022 - Sept 2023"
              content: "Contrat en alternance. Gestion des utilisateurs, administration des serveurs, maintenance du réseau local, support technique aux agents municipaux."

        - company: "LM Wind Power"
          companyUrl: "https://lmwindpower.com/"
          jobs:
            - name: "Helpdesk IT"
              date: "Juin 2022 - Juillet 2022"
              content: "Stage. Support technique, assistance aux utilisateurs, configuration de postes de travail."

        - company: "Daltoner"
          companyUrl: "https://daltoner.fr/"
          jobs:
            - name: "Assistance informatique au public"
              date: "Juin 2021"
              content: "Stage. Support technique à la clientèle, diagnostique et réparation de matériel informatique."

        - company: "LC Informatique"
          companyUrl: "https://lcinformatique.com/"
          jobs:
           - name: "Maintenance informatique"
             date: "Janvier 2021"
             content: "Stage. Maintenance préventive et corrective, dépannage de matériel, installation de logiciels."

        - company: "Cash Express"
          companyUrl: "https://cashexpress.fr/"
          jobs:
            - name: "Vente et rayonnage de matériel informatique"
              date: "Janvier 2020"
              content: "Stage. Vente de composants informatiques, conseil clients, gestion des stocks."
      education:
        items:
          - title: "BTS Services Informatiques aux Organisations (SIO)"
            school:
              name: "Pole BTS Alternance Caen"
              url: "https://polebtsalternance.fr/"
            date: "09/2023 - 06/2025"
            GPA: "Acquis !"
            content: |-
              Option: Solution d'Infrastructure Système et Réseaux (SISR)
              
              Spécialisation dans les domaines:
                - Infrastructure réseau
                - Administration système
                - Gestion de serveurs
                - Support technique

          - title: "Baccalauréat Professionnel - Systèmes Numériques"
            school:
              name: "Lycée Charles Tellier"
              url: "https://www.lyceetellier.fr/"
            date: "09/2022 - 06/2023"
            GPA: "Mention TRÈS BIEN"
            content: |-
              Option C: Réseaux informatiques et systèmes communicants
              Condé-Sur-Noireau

          - title: "Brevet des Collèges"
            school:
              name: "Collège D. Diderot"
              url: "https://diderot-cherbourg-en-cotentin.college.ac-normandie.fr/"
            date: "09/2019 - 07/2020"
            GPA: "Mention BIEN"
            content: |-
              Tourlaville

      projects:
        items:
          - title: "Mon installation Home Assistant"
            content: "Projet personnel de domotique. Renouvellement de l'infrastructure domotique pour un contrôle total des appareils connectés. Intégration de multiples protocoles (Google Home, robot aspirateur, Freebox, serveur HomeLab, etc.). Mise en place d'automatisations avancées basées sur les horaires et conditions météorologiques."
            image: /images/projects/02/homeassistant.png
            featured:
              name: Article
              link: /blogs/home-assistant/
            badges:
              - "Home Assistant"
              - "Domotique"
              - "Automatisation"
            links:
              - icon: fab fa-wordpress
                url: /blogs/home-assistant/

          - title: "Raccordement réseau de bâtiments"
            content: "Projet professionnel réalisé chez GE Vernova. Raccordement de deux bâtiments à l'infrastructure réseau principale pour l'installation de bornes WiFi. Passage de fibre, configuration de switches, brassage de prises RJ45, respect des normes T568A/B, génération de carte de signal (HeatMap) avec WifiMan pour optimiser la portée."
            image: /images/projects/01/normes-T568.webp
            featured:
              name: Détails
              link: https://antoinebecquet93.wordpress.com/2025/02/13/raccordement-reseau-de-batiments/
            badges:
              - "Réseau"
              - "Infrastructure"
              - "WiFi"
              - "PoE"
            links:
              - icon: fab fa-wordpress
                url: https://antoinebecquet93.wordpress.com/2025/02/13/raccordement-reseau-de-batiments/

          - title: "Administration système et réseau"
            content: "Expérience acquise lors de contrats en alternance et stages. Gestion d'Active Directory, administration de serveurs, configuration de postes de travail, support aux utilisateurs, maintenance préventive et corrective."
            image: /images/placeholders/profile2.jpg
            badges:
              - "Active Directory"
              - "Windows Server"
              - "Linux"
              - "PowerShell"    
      contact:
        enable: true
        # title: "Custom Name"
        content: "Je suis toujours ouvert à la communication. Que vous ayez une question ou que vous souhaitiez simplement dire bonjour, n'hésitez pas à me contacter !"
        btnName: "Ecrivez-moi"
        btnLink: mailto:antoinebecquet93@gmail.com
